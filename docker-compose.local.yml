services:
  backend:
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    volumes:
      - ./nest_:/app
      - /app/node_modules
    command: sh -c "npx prisma db push && npm run start:dev"

  frontend:
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./next_:/app
      - /app/node_modules
    command: npx next dev -p 3000
